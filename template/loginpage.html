{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="{% static 'favicon.ico' %}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodie</title>

    <style>
        body {
            background: #C4E2F5;
            font-family: system-ui, -apple-system, sans-serif;
            color: #000;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .info-header {
            text-align: center;
            max-width: 350px;
            margin-bottom: 20px;
        }

        .info-header h1 {
            margin: 0 0 5px 0;
            font-size: 28px;
            font-weight: 800;
        }

        .info-header p {
            margin: 0;
            font-size: 14px;
            color: #444;
        }

        .card {
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #E5E5E5;
            width: 100%;
            max-width: 350px;
            box-sizing: border-box;
        }

        .card h2 {
            margin: 0 0 15px 0;
            font-size: 20px;
            text-align: center;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"] {
            width: 100%;
            padding: 10px;
            margin: 6px 0 12px 0;
            border: 1px solid #DCE4EC;
            border-radius: 6px;
            background: #FAFAFA;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
        }

        input[type="submit"] {
            width: 100%;
            padding: 12px;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-sizing: border-box;
        }

        input[type="submit"]:hover {
            opacity: 0.9;
        }

        .account-note {
            margin-top: 12px;
            text-align: center;
            font-size: 13px;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="info-header">
        <h1>Foodie</h1>
        <p>
            Talk with AI assistants, search ingredients,
            and track critical health data metrics.
        </p>
    </div>

    <div class="card">
        <h2>Login</h2>

        <form method="POST" autocomplete="off">
            {% csrf_token %}
            {{ form.as_p }}

            <input type="submit" value="Continue">
        </form>

        <div class="account-note">
            New here? Your account will be created automatically.
        </div>
    </div>

</body>
</html>
