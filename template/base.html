{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodie</title>
    <link rel="icon" href="{% static 'favicon.ico' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            background: #C4E2F5;
            display: flex;
            flex-direction: column;
            min-height: 100vh; /* Keeps footer pinned to bottom if content is short */
        }
        .navbar-nav .nav-link {
            font-weight: 300; /* Lighter links */
        }
        .navbar-nav .nav-link.active {
            font-weight: 700; /* Bolder active link */
        }
        .navbar-brand {
            font-weight: 800;
            font-size: xx-large;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="{% url 'home' %}">Foodie</a>
    
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    
    <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
      <div class="navbar-nav mx-auto gap-3 text-center">
        <a class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="{% url 'home' %}">Home</a>
        <a class="nav-link {% if request.resolver_match.url_name == 'chat' %}active{% endif %}" href="{% url 'chat' %}">Chat</a>
        <a class="nav-link {% if request.resolver_match.url_name == 'foods' %}active{% endif %}" href="{% url 'foods' %}">Foods</a>
        
        <a class="nav-link {% if request.resolver_match.url_name == 'health_page' %}active{% endif %}" href="{% url 'health_page' %}">Health</a>
        
        <a class="nav-link" href="{% url 'bye' %}">Logout</a>
      </div>
    </div>
  </div>
</nav>

<main class="flex-grow-1">
    {% block content %}
    {% endblock content %}
</main>

<footer class="bg-body-tertiary border-top shadow-sm py-3 mt-auto">
  <div class="container-fluid px-4 d-flex flex-wrap justify-content-between align-items-center">
<span class="text-muted small">&copy; 2026 Foodie Inc. Plz prefer to doctor for diagnosis.</span>

  </div>
</footer>

</body>
</html>
